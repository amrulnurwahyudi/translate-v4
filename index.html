<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Continuous Voice Translator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --active-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 800px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
    }

    select {
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    .swap-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.3rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .swap-btn:hover {
      color: var(--accent);
    }

    .translation-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      flex-grow: 1;
      overflow: hidden;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .controls, .translation-area {
        grid-template-columns: 1fr;
      }
      .translation-area {
        grid-template-rows: 1fr 1fr;
      }
      .swap-btn {
        transform: rotate(90deg);
        margin: auto;
      }
    }

    .box {
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .box label {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
      text-transform: uppercase;
    }

    .log-container {
      flex-grow: 1;
      overflow-y: auto;
      font-size: 1rem;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    /* Kustom Scrollbar */
    .log-container::-webkit-scrollbar {
      width: 6px;
    }
    .log-container::-webkit-scrollbar-thumb {
      background-color: var(--border);
      border-radius: 4px;
    }

    .log-item {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .log-item.translated {
      border-left: 3px solid #10b981;
      color: #10b981;
    }

    .mic-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mic-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }

    .mic-btn:hover {
      background-color: var(--accent-hover);
    }

    .mic-btn.listening {
      background-color: var(--active-red);
      animation: pulse 1.5s infinite;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .status {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .speaking {
      color: #10b981;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Continuous Voice Translator</h1>

    <!-- Pilihan Bahasa -->
    <div class="controls">
      <select id="sourceLang">
        <option value="id-ID" data-code="id">Indonesia</option>
        <option value="en-US" data-code="en" selected>Inggris (AS)</option>
        <option value="ja-JP" data-code="ja">Jepang</option>
        <option value="ko-KR" data-code="ko">Korea</option>
        <option value="zh-CN" data-code="zh">Mandarin</option>
        <option value="ar-SA" data-code="ar">Arab</option>
      </select>

      <button class="swap-btn" id="swapBtn" title="Tukar Bahasa">⇄</button>

      <select id="targetLang">
        <option value="id-ID" data-code="id" selected>Indonesia</option>
        <option value="en-US" data-code="en">Inggris (AS)</option>
        <option value="ja-JP" data-code="ja">Jepang</option>
        <option value="ko-KR" data-code="ko">Korea</option>
        <option value="zh-CN" data-code="zh">Mandarin</option>
        <option value="ar-SA" data-code="ar">Arab</option>
      </select>
    </div>

    <!-- Tampilan Teks Riwayat (Log) -->
    <div class="translation-area">
      <div class="box">
        <label>Suara Masuk (Dengar)</label>
        <div id="inputLog" class="log-container">
          <div class="log-item" style="color: var(--text-sub);">Ketuk mikrofon di bawah dan mulailah berbicara...</div>
        </div>
      </div>
      <div class="box">
        <label>Hasil Terjemahan</label>
        <div id="outputLog" class="log-container">
          <div class="log-item translated" style="color: var(--text-sub);">Terjemahan akan muncul secara berurutan...</div>
        </div>
      </div>
    </div>

    <!-- Tombol Mikrofon -->
    <div class="mic-container">
      <button id="micBtn" class="mic-btn" title="Mulai/Matikan Mikrofon">🎙️</button>
      <div id="statusText" class="status">Mikrofon nonaktif. Ketuk untuk menyalakan.</div>
    </div>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const inputLog = document.getElementById('inputLog');
    const outputLog = document.getElementById('outputLog');
    const sourceLangSelect = document.getElementById('sourceLang');
    const targetLangSelect = document.getElementById('targetLang');
    const swapBtn = document.getElementById('swapBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Browser Anda tidak mendukung Web Speech API.");
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      let userWantsListening = false;
      let lastFinalTranscript = ""; // Mencegah duplikasi kalimat masuk

      micBtn.addEventListener('click', () => {
        userWantsListening = !userWantsListening;

        if (userWantsListening) {
          // Bersihkan teks panduan awal jika baru pertama kali klik
          if (inputLog.children.length === 1 && inputLog.children[0].style.color) {
            inputLog.innerHTML = '';
            outputLog.innerHTML = '';
          }
          try {
            recognition.lang = sourceLangSelect.value;
            recognition.start();
          } catch (e) {
            console.log(e);
          }
        } else {
          recognition.stop();
          setMicStoppedState();
        }
      });

      recognition.onstart = () => {
        micBtn.classList.add('listening');
        micBtn.textContent = "⏹️";
        statusText.textContent = "Mikrofon AKTIF (Mendengarkan terus-menerus)...";
        statusText.classList.add('speaking');
      };

      recognition.onend = () => {
        if (userWantsListening) {
          try {
            recognition.start(); // Auto-reconnect jika terputus otomatis oleh sistem
          } catch (e) {
            console.log(e);
          }
        } else {
          setMicStoppedState();
        }
      };

      recognition.onresult = async (event) => {
        let interimText = '';
        let finalSegment = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalSegment += text;
          } else {
            interimText += text;
          }
        }

        // Jika ada kalimat final baru yang dikenali
        if (finalSegment.trim() !== '' && finalSegment !== lastFinalTranscript) {
          lastFinalTranscript = finalSegment;

          // Tambahkan ke Log Riwayat Masuk (Tidak Menghapus yang Lama)
          appendLog(inputLog, finalSegment, false);

          // Terjemahkan teks tersebut
          const sourceCode = sourceLangSelect.options[sourceLangSelect.selectedIndex].getAttribute('data-code');
          const targetCode = targetLangSelect.options[targetLangSelect.selectedIndex].getAttribute('data-code');

          const translatedText = await translateText(finalSegment, sourceCode, targetCode);
          
          // Tambahkan hasil terjemahan ke Log Riwayat Keluar
          appendLog(outputLog, translatedText, true);

          // Bacakan hasil terjemahan
          speakText(translatedText, targetLangSelect.value);
        }
      };

      recognition.onerror = (event) => {
        console.error("Speech Error:", event.error);
        if (event.error === 'not-allowed') {
          alert("Izin mikrofon ditolak.");
          userWantsListening = false;
          setMicStoppedState();
        }
      };

      function setMicStoppedState() {
        micBtn.classList.remove('listening');
        micBtn.textContent = "🎙️";
        statusText.textContent = "Mikrofon nonaktif. Ketuk untuk menyalakan.";
        statusText.classList.remove('speaking');
      }
    }

    // Fungsi untuk menambah baris riwayat teks ke bawah tanpa menghapus data sebelumnya
    function appendLog(container, text, isTranslated) {
      const div = document.createElement('div');
      div.className = isTranslated ? 'log-item translated' : 'log-item';
      div.textContent = text;
      container.appendChild(div);
      
      // Auto scroll ke bawah agar teks terbaru selalu terlihat
      container.scrollTop = container.scrollHeight;
    }

    async function translateText(text, fromLang, toLang) {
      try {
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`);
        const data = await response.json();
        return data.responseData.translatedText || "Gagal menerjemahkan";
      } catch (err) {
        return "Gagal terhubung ke server.";
      }
    }

    function speakText(text, langCode) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode;
        window.speechSynthesis.speak(utterance);
      }
    }

    swapBtn.addEventListener('click', () => {
      const tempVal = sourceLangSelect.value;
      sourceLangSelect.value = targetLangSelect.value;
      targetLangSelect.value = tempVal;
    });
  </script>
</body>
</html>
